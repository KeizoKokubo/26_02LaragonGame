<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laragon 学生作品一覧 & IPポータル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-indigo: #818cf8;
            --accent-emerald: #34d399;
            --accent-amber: #fbbf24;
            --accent-rose: #fb7185;
            --gradient-hero: linear-gradient(135deg, #0284c7 0%, #6366f1 50%, #8b5cf6 100%);
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Header & Hero */
        .hero {
            background: var(--gradient-hero);
            padding: 44px 24px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.15), transparent 70%);
            pointer-events: none;
        }

        .hero-title {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .hero-subtitle {
            font-size: 1.05rem;
            opacity: 0.95;
            font-weight: 500;
            max-width: 650px;
            margin: 0 auto;
        }

        /* Stats Bar */
        .stats-container {
            max-width: 1240px;
            margin: -32px auto 28px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            font-size: 1.8rem;
            background: rgba(255, 255, 255, 0.08);
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-blue);
            line-height: 1.2;
        }

        .stat-lbl {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Main Container */
        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Controls Section (Search & Filter) */
        .controls-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag-btn {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.83rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn:hover, .tag-btn.active {
            background: var(--accent-blue);
            color: #0f172a;
            border-color: var(--accent-blue);
            font-weight: 700;
        }

        .view-switcher {
            display: flex;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 4px;
            gap: 4px;
        }

        .view-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: var(--bg-card);
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* Cards Grid */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        .student-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
            box-shadow: var(--shadow-card);
            position: relative;
        }

        .student-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 16px 30px -10px rgba(56, 189, 248, 0.25);
        }

        /* Absent (Disabled) Card Style */
        .student-card.absent {
            opacity: 0.55;
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(251, 113, 133, 0.3);
            filter: grayscale(40%);
        }

        .student-card.absent:hover {
            transform: none;
            box-shadow: var(--shadow-card);
            border-color: rgba(251, 113, 133, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .student-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            font-weight: 800;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.05em;
        }

        .multi-badge {
            background: rgba(129, 140, 248, 0.2);
            color: var(--accent-indigo);
            font-weight: 700;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 6px;
        }

        .absent-badge {
            background: rgba(251, 113, 133, 0.2);
            color: var(--accent-rose);
            font-weight: 800;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .student-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .folder-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 4px;
            word-break: break-all;
        }

        .card-body {
            margin: 16px 0;
            flex-grow: 1;
        }

        /* URL Item Box */
        .url-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        .url-item.health-online {
            border-left: 4px solid var(--accent-emerald);
        }

        .url-item.health-error {
            border-left: 4px solid var(--accent-rose);
            background: rgba(251, 113, 133, 0.04);
        }

        .url-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .url-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Health status badge */
        .health-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .health-badge.online {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-emerald);
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .health-badge.error {
            background: rgba(251, 113, 133, 0.15);
            color: var(--accent-rose);
            border: 1px solid rgba(251, 113, 133, 0.3);
        }

        .url-text {
            font-family: monospace;
            font-size: 0.88rem;
            color: var(--text-primary);
            word-break: break-all;
            margin-bottom: 10px;
        }

        .url-actions {
            display: flex;
            gap: 8px;
        }

        .btn-launch-single {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
            padding: 9px 14px;
            background: var(--accent-blue);
            color: #0f172a;
            font-weight: 700;
            font-size: 0.88rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-launch-single:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
        }

        .btn-launch-single.warning {
            background: rgba(251, 113, 133, 0.2);
            color: var(--accent-rose);
            border: 1px solid rgba(251, 113, 133, 0.4);
        }

        .btn-launch-single.warning:hover {
            background: var(--accent-rose);
            color: #ffffff;
        }

        .btn-launch-single.disabled {
            background: #334155 !important;
            color: #64748b !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-copy-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy-small:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .notes-box {
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed rgba(251, 191, 36, 0.3);
            border-radius: var(--radius-sm);
            padding: 10px;
            font-size: 0.85rem;
            color: #fde68a;
            margin-top: 10px;
        }

        .no-url-badge {
            text-align: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Table View */
        .table-view {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .student-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .student-table th {
            background: rgba(15, 23, 42, 0.8);
            padding: 16px 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 700;
            border-bottom: 1px solid var(--border-color);
        }

        .student-table td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.93rem;
            vertical-align: middle;
        }

        .student-table tr.absent-row {
            opacity: 0.5;
            background: rgba(251, 113, 133, 0.03);
        }

        .student-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent-emerald);
            color: #0f172a;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <!-- Hero Header -->
    <header class="hero">
        <h1 class="hero-title">Laragon 学生作品 & IPアクセス ポータル</h1>
        <p class="hero-subtitle">全作品のアクセス自動診断機能付き！ワンクリックで各学生の複数作品へジャンプできます</p>
    </header>

    <!-- Stats Bar -->
    <div class="stats-container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">🎓</div>
                <div>
                    <div class="stat-val" id="statTotal">0</div>
                    <div class="stat-lbl">対象学生数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🟢</div>
                <div>
                    <div class="stat-val" id="statOnline" style="color: var(--accent-emerald);">0</div>
                    <div class="stat-lbl">接続正常 (OK)</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔴</div>
                <div>
                    <div class="stat-val" id="statError" style="color: var(--accent-rose);">0</div>
                    <div class="stat-lbl">アクセスエラー</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📁</div>
                <div>
                    <div class="stat-val" id="statMulti">0</div>
                    <div class="stat-lbl">複数作品所持数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💤</div>
                <div>
                    <div class="stat-val" id="statAbsent" style="color: var(--accent-amber);">0</div>
                    <div class="stat-lbl">本日欠席</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="container">
        
        <!-- Controls Bar -->
        <div class="controls-bar">
            <!-- Search Box -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="学生名、番号、IPアドレス、フォルダ名で検索..." oninput="filterData()">
            </div>

            <!-- Filter Tags -->
            <div class="filter-tags">
                <button class="tag-btn active" onclick="setFilter('all', this)">すべて</button>
                <button class="tag-btn" onclick="setFilter('online', this)">接続OK 🟢</button>
                <button class="tag-btn" onclick="setFilter('error', this)">アクセスエラー 🔴</button>
                <button class="tag-btn" onclick="setFilter('multi', this)">複数作品所持 📁</button>
                <button class="tag-btn" onclick="setFilter('present', this)">出席のみ 🟢</button>
                <button class="tag-btn" onclick="setFilter('absent', this)">欠席のみ 💤</button>
            </div>

            <!-- View Switcher -->
            <div class="view-switcher">
                <button class="view-btn active" id="btnGridView" onclick="switchView('grid')">
                    <span>🎴</span> カード
                </button>
                <button class="view-btn" id="btnTableView" onclick="switchView('table')">
                    <span>📑</span> リスト
                </button>
            </div>
        </div>

        <!-- Cards View -->
        <div id="gridView" class="grid-view"></div>

        <!-- Table View -->
        <div id="tableView" class="table-view">
            <table class="student-table">
                <thead>
                    <tr>
                        <th style="width: 70px;">番号</th>
                        <th style="width: 160px;">氏名</th>
                        <th style="width: 150px;">フォルダ情報</th>
                        <th>作品URL & 疎通診断</th>
                        <th style="width: 140px;">備考</th>
                        <th style="width: 180px; text-align: center;">アクション</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">クリップボードにコピーしました！</div>

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = rawStudentsData.filter(st => {
                if (currentFilter === 'present' && st.is_absent) return false;
                if (currentFilter === 'absent' && !st.is_absent) return false;
                if (currentFilter === 'multi' && st.urls.length <= 1) return false;
                if (currentFilter === 'online' && !st.urls.some(u => u.health && u.health.status === 'online')) return false;
                if (currentFilter === 'error' && !st.urls.some(u => u.health && u.health.status === 'error')) return false;

                if (!query) return true;

                const matchNum = (st.num || '').toLowerCase().includes(query);
                const matchName = (st.name || '').toLowerCase().includes(query);
                const matchFolder = (st.folder_name || '').toLowerCase().includes(query);
                const matchUrl = st.urls.some(u => u.url.toLowerCase().includes(query) || u.label.toLowerCase().includes(query));
                const matchNotes = st.notes.some(n => n.content.toLowerCase().includes(query) || n.title.toLowerCase().includes(query));

                return matchNum || matchName || matchFolder || matchUrl || matchNotes;
            });

            renderGrid(filtered);
            renderTable(filtered);
        }

        function setFilter(filterType, btnEl) {
            currentFilter = filterType;
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            filterData();
        }

        function switchView(viewType) {
            const gridEl = document.getElementById('gridView');
            const tableEl = document.getElementById('tableView');
            const btnGrid = document.getElementById('btnGridView');
            const btnTable = document.getElementById('btnTableView');

            if (viewType === 'grid') {
                gridEl.style.display = 'grid';
                tableEl.style.display = 'none';
                btnGrid.classList.add('active');
                btnTable.classList.remove('active');
            } else {
                gridEl.style.display = 'none';
                tableEl.style.display = 'block';
                btnGrid.classList.remove('active');
                btnTable.classList.add('active');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', () => {
            initStats();
            filterData();
        });
